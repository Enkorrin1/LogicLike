name: logic_like
description: Family-edtech mobile app for short daily logic challenges.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.0.1
  flutter_localizations:
    sdk: flutter
  flutter_timezone: ^5.1.0
  intl: any
  shared_preferences: ^2.2.3
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/areas/
