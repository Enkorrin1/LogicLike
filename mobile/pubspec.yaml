name: logicloka
description: Family-edtech mobile app for short daily logic challenges.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flame: ^1.37.0
  flame_audio: ^2.12.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^22.0.1
  flutter_localizations:
    sdk: flutter
  flutter_timezone: ^5.1.0
  flutter_tts: ^4.2.5
  google_sign_in: ^7.2.0
  intl: any
  shared_preferences: ^2.2.3
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# path_provider_android 2.3.x introduces a native jni build that is currently
# blocked by Android Gradle/CMake file locking on this Windows environment.
# Keep the compatible, non-native implementation until that upstream issue is resolved.
dependency_overrides:
  path_provider_android: 2.2.23

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/areas/
